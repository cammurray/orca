name: Publish ORCAPreview to PowerShell Gallery

# Publishes the ORCAPreview module to the PowerShell Gallery on every check-in to
# the dev branch. The version is derived from the currently published ORCAPreview
# version with the patch number bumped, so each publish is unique and increasing.
# Can also be run manually with an explicit version.

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      version:
        description: 'Module version to publish (e.g. 2.8.3). Defaults to the next patch above the published version.'
        required: false

env:
  # Base version used only for the very first publish (when nothing is on the Gallery yet).
  PREVIEW_VERSION_BASE: '2.8.0'

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          $v = '${{ github.event.inputs.version }}'
          if ([string]::IsNullOrWhiteSpace($v)) {
            $published = Find-Module ORCAPreview -Repository PSGallery -ErrorAction SilentlyContinue
            if ($published) {
              $cur = [version]$published.Version
              $v = '{0}.{1}.{2}' -f $cur.Major, $cur.Minor, ($cur.Build + 1)
            } else {
              $v = '${{ env.PREVIEW_VERSION_BASE }}'
            }
          }
          $v = $v.TrimStart('v', 'V')
          if ([string]::IsNullOrWhiteSpace($v)) { throw 'No version could be determined.' }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Publishing ORCAPreview version $v"

      - name: Build module
        shell: pwsh
        run: ./Build.ps1 -Version '${{ steps.ver.outputs.version }}' -OutputDirectory '${{ github.workspace }}/output'

      - name: Publish to PowerShell Gallery
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PSGALLERY_API_KEY)) {
            throw 'The PSGALLERY_API_KEY secret is not set. Add it under Settings > Secrets and variables > Actions.'
          }
          $modulePath = Join-Path '${{ github.workspace }}/output' 'ORCAPreview'
          Test-ModuleManifest -Path (Join-Path $modulePath 'ORCAPreview.psd1') | Out-Null
          Publish-Module -Path $modulePath -NuGetApiKey $env:PSGALLERY_API_KEY -Repository PSGallery -Verbose
